name: Publish VS Code Extension

on:
  push:
    branches:
      - main
    paths:
      - 'vscode-extension/**'
      - 'lib/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/publish-vscode-extension.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-vscode-extension
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip vscode publish]')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Bump extension patch version
        id: bump
        run: |
          node <<'NODE'
          const fs = require('fs')

          const packagePath = 'package.json'
          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'))
          const parts = String(pkg.version).split('.').map((part) => Number(part))

          if (parts.length !== 3 || parts.some((part) => !Number.isInteger(part) || part < 0)) {
            throw new Error(`Invalid package version: ${pkg.version}`)
          }

          parts[2] += 1

          // Carry over when a segment reaches 10.
          // Example: 0.1.9 -> 0.2.0
          for (let i = 2; i > 0; i -= 1) {
            if (parts[i] >= 10) {
              parts[i] = 0
              parts[i - 1] += 1
            }
          }

          const nextVersion = parts.join('.')
          pkg.version = nextVersion
          fs.writeFileSync(packagePath, `${JSON.stringify(pkg, null, 2)}\n`)

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${nextVersion}\n`)
          console.log(`Bumped vscode-extension to ${nextVersion}`)
          NODE

      - name: Commit bumped version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vscode-extension/package.json
          git commit -m "chore(vscode-extension): bump version to ${{ steps.bump.outputs.version }} [skip vscode publish]"
          git push
        working-directory: .

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: pnpm dlx @vscode/vsce publish --no-dependencies -p "$VSCE_PAT"
